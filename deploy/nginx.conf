server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 安全响应头（后端也会设置，这里对静态资源补齐）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 负载均衡 / 容器健康检查端点，直接返回 200
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite 构建产物带内容 hash，可长期强缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 前端：找不到文件时回退到 index.html，交给前端路由；index.html 不缓存以保证及时更新
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反向代理：保持同源，Cookie（SESSION / XSRF-TOKEN）无需跨域配置
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 只暴露健康检查，其余 actuator 端点不对外开放
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
