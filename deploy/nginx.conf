server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 安全响应头（后端也会设置，这里对静态资源补齐）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # SPA 前端：找不到文件时回退到 index.html，交给前端路由
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缺失要真的 404，不能回退成 index.html（否则浏览器会把 HTML 当 js/css 解析）
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # 通知流（SSE）：必须关闭缓冲，否则事件会被 nginx 攒住不下发；长连接要放宽读超时
    location = /api/v1/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API 反向代理：保持同源，Cookie（SESSION / XSRF-TOKEN）无需跨域配置
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 只暴露健康检查，其余 actuator 端点不对外开放
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
